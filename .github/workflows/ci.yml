name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Check formatting
        run: sbt -batch scalafmtCheckAll scalafmtSbtCheck

      - name: Compile and test
        run: sbt -batch test

      - name: Validate bundled rules
        run: sbt -batch "run check-rules src/main/resources/default.rules"

      - name: Build fat jar
        run: sbt -batch assembly

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t canopy-risk:ci .
      - name: Smoke test
        run: |
          docker run -d --name canopy -e PORT=9000 -p 9000:9000 canopy-risk:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9000/health; then exit 0; fi
            sleep 2
          done
          docker logs canopy
          exit 1
